# 운영(prod) 설정 템플릿(커밋 대상). 실제 값은 넣지 않는다.
# 비밀값 env는 AWS Secrets Manager poppang/prod/app에서 렌더링한 be.env로, 나머지 env는 Compose로 주입한다.
# 기본값이 없는 ${ENV}가 비어 있으면 기동에 실패한다.
spring:
  application:
    name: poppang-be-prod
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  jpa:
    hibernate:
      # 운영 스키마는 바꾸지 않는다(스키마 동결). validate만 쓴다.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  autoconfigure:
    exclude: org.springframework.boot.actuate.autoconfigure.metrics.SystemMetricsAutoConfiguration

logging:
  level:
    org.springframework.security: DEBUG
    io.lettuce.core: DEBUG
    org.springframework.data.redis: DEBUG
    org.springframework.boot.context.config: DEBUG

app:
  storage:
    # 운영 제보 이미지는 S3에 저장한다. key는 URL 경로에서 앞의 '/'를 뺀 값이다(submissionImages/yyyy/MM/uuid.확장자).
    submission-image-storage-type: s3
    submission-image-s3-bucket: ${SUBMISSION_IMAGE_S3_BUCKET}
    submission-image-s3-region: ${SUBMISSION_IMAGE_S3_REGION}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  redirect-uri: ${KAKAO_REDIRECT_URI}
  token-uri: ${KAKAO_TOKEN_URI}
  user-info-uri: ${KAKAO_USER_INFO_URI}

google:
  client-id: ${GOOGLE_CLIENT_ID}
  ios-client-id: ${GOOGLE_IOS_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: ${GOOGLE_REDIRECT_URI}
  scope: ${GOOGLE_SCOPE}
  token-uri: ${GOOGLE_TOKEN_URI}
  user-info-uri: ${GOOGLE_USER_INFO_URI}

apple:
  client-id: ${APPLE_CLIENT_ID}
  web-client-id: ${APPLE_WEB_CLIENT_ID}
  team-id: ${APPLE_TEAM_ID}
  key-id: ${APPLE_KEY_ID}
  # 컨테이너에 읽기 전용으로 마운트한 Apple 로그인 키 파일 경로
  private-key-path: ${APPLE_PRIVATE_KEY_PATH}
  redirect-uri: ${APPLE_REDIRECT_URI}
  token-uri: ${APPLE_TOKEN_URI}

jwt:
  secret: ${JWT_SECRET}
  access-token-exp-minutes: ${JWT_ACCESS_TOKEN_EXP_MINUTES}
  refresh-token-exp-days: ${JWT_REFRESH_TOKEN_EXP_DAYS}
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}
  signup-audience: ${JWT_SIGNUP_AUDIENCE}
  signup-token-exp-minutes: ${JWT_SIGNUP_TOKEN_EXP_MINUTES}

poppang:
  mail:
    from: ${POPPANG_MAIL_FROM}
    password: ${POPPANG_MAIL_PASSWORD}
    admins: ${POPPANG_MAIL_ADMINS}

qa:
  auth:
    api-key: ${QA_AUTH_API_KEY}
    member-user-uuid: ${QA_AUTH_MEMBER_USER_UUID}
    admin-user-uuid: ${QA_AUTH_ADMIN_USER_UUID}

internal:
  worker:
    api-key: ${INTERNAL_WORKER_API_KEY}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED}
    path: ${SPRINGDOC_API_DOCS_PATH}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED}
    path: ${SPRINGDOC_SWAGGER_UI_PATH}
    url: ${SPRINGDOC_SWAGGER_UI_URL}
