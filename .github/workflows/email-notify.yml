# ✅ 기능 요약
#
# PR 생성 시 이메일 발송
# PR 병합 시 이메일 발송
# PR 코드리뷰(라인 댓글) 시 이메일 발송
# 이슈 생성 시 이메일 발송
# 불필요한 항목은 출력하지 않음

# 📧 이메일 알림을 위한 GitHub Actions

name: Email Notifications

on:
  issues:
    types: [opened]  # ✅ 이슈 생성 시
  pull_request:
    types: [opened, closed]  # ✅ PR 생성 및 병합 시
  issue_comment:
    types: [created]  # ✅ PR에 달린 일반 댓글
  pull_request_review_comment:
    types: [created]  # ✅ PR 코드 한 줄 옆에 달린 댓글
  pull_request_review:
    types: [submitted]  # ✅ 전체 PR에 대한 리뷰 제출 (💡 지금 추가한 부분)

permissions:
  contents: read

jobs:
  notify_by_email:
    runs-on: ubuntu-latest

    steps:
      - name: Set Custom Event Name and Build Body
        id: set_event_name
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PULL_REQUEST_MERGED: ${{ github.event.pull_request.merged }}
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
          PULL_REQUEST_URL: ${{ github.event.pull_request.html_url }}
          ISSUE_PULL_REQUEST_JSON: ${{ toJson(github.event.issue.pull_request) }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          COMMENT_PATH: ${{ github.event.comment.path }}
          COMMENT_LINE: ${{ github.event.comment.line }}
          REVIEW_BODY: ${{ github.event.review.body }}
          REVIEW_URL: ${{ github.event.review.html_url }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          EVENT_LABEL=""
          BODY=""
          TITLE=""
          LINK=""
          COMMENT=""
          FILE=""
          LINE=""

          write_outputs() {
            local event_label="$1"
            local body="$2"
            local output_delimiter

            while true; do
              output_delimiter="POPPANG_BODY_${GITHUB_RUN_ID:-0}_${GITHUB_RUN_ATTEMPT:-0}_${RANDOM}_${RANDOM}_${RANDOM}_${RANDOM}"
              [[ "$body" != *"$output_delimiter"* ]] && break
            done

            {
              printf 'event_label=%s\n' "$event_label"
              printf 'body<<%s\n' "$output_delimiter"
              printf '%s\n' "$body"
              printf '%s\n' "$output_delimiter"
            } >> "$GITHUB_OUTPUT"
          }

          if [[ "${EVENT_NAME:-}" == "pull_request" ]]; then
            if [[ "${EVENT_ACTION:-}" == "opened" ]]; then
              EVENT_LABEL="PR 생성"
            elif [[ "${EVENT_ACTION:-}" == "closed" && "${PULL_REQUEST_MERGED:-}" == "true" ]]; then
              EVENT_LABEL="PR 병합"
            else
              write_outputs "무시됨" "병합되지 않고 닫힌 PR이므로 알림 제외됨"
              exit 0
            fi
            TITLE="${PULL_REQUEST_TITLE:-}"
            LINK="${PULL_REQUEST_URL:-}"

          elif [[ "${EVENT_NAME:-}" == "issue_comment" ]]; then
            if [[ "${ISSUE_PULL_REQUEST_JSON:-null}" != "null" ]]; then
              EVENT_LABEL="PR 댓글"
              TITLE="${ISSUE_TITLE:-}"
              LINK="${COMMENT_URL:-}"
              COMMENT="${COMMENT_BODY:-}"
              FILE="${COMMENT_PATH:-}"
              LINE="${COMMENT_LINE:-}"
            else
              write_outputs "무시됨" "이슈 댓글이므로 알림 제외됨"
              exit 0
            fi

          elif [[ "${EVENT_NAME:-}" == "pull_request_review_comment" ]]; then
            EVENT_LABEL="PR 코드리뷰 댓글"
            TITLE="${PULL_REQUEST_TITLE:-}"
            LINK="${COMMENT_URL:-}"
            COMMENT="${COMMENT_BODY:-}"
            FILE="${COMMENT_PATH:-}"
            LINE="${COMMENT_LINE:-}"

          elif [[ "${EVENT_NAME:-}" == "pull_request_review" ]]; then
            EVENT_LABEL="PR 리뷰 제출"
            TITLE="${PULL_REQUEST_TITLE:-}"
            LINK="${REVIEW_URL:-}"
            COMMENT="${REVIEW_BODY:-}"

          elif [[ "${EVENT_NAME:-}" == "issues" ]]; then
            EVENT_LABEL="이슈 생성"
            TITLE="${ISSUE_TITLE:-}"
            LINK="${ISSUE_URL:-}"

          else
            write_outputs "무시됨" "지원되지 않는 이벤트입니다."
            exit 0
          fi

          BODY+="📌 이벤트 종류: $EVENT_LABEL"$'\n'
          BODY+="📁 리포지토리: ${REPOSITORY:-N/A}"$'\n'
          BODY+="🛠️ 액션: ${EVENT_ACTION:-N/A}"$'\n'
          BODY+="📝 제목: ${TITLE:-N/A}"$'\n'
          BODY+="🙋 작성자: ${ACTOR:-N/A}"$'\n'
          [[ -n "$LINK" ]] && BODY+="🔗 링크: $LINK"$'\n'
          [[ -n "$COMMENT" ]] && BODY+="🗨️ 댓글 내용: $COMMENT"$'\n'
          [[ -n "$FILE" ]] && BODY+="📄 파일: $FILE"$'\n'
          [[ -n "$LINE" ]] && BODY+="📌 위치: Line $LINE"$'\n'

          write_outputs "$EVENT_LABEL" "$BODY"

      - name: Send Email Notification
        if: steps.set_event_name.outputs.event_label != '무시됨'
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: GitHub 알림 - ${{ steps.set_event_name.outputs.event_label }} 발생!
          body: ${{ steps.set_event_name.outputs.body }}
          # to: devsong42@gmail.com, indextrown@gmail.com
          to: indextrown@gmail.com
          from: GitHub Notifier <${{ secrets.MAIL_USERNAME }}>
