name: PopPang BE CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

  # schedule:
  #   # UTC 22:00 = KST 07:00
  #   - cron: "0 22 * * *"

permissions:
  contents: read

concurrency:
  group: poppang-production-deployment
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    name: Main Verify
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Test and format check
        run: ./gradlew clean test spotlessCheck --no-daemon

  build-and-deploy:
    name: Build and Deploy Production
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    env:
      APP_NAME: poppang-prod
      CONTAINER_NAME: poppang-prod
      SERVER_DIR: /home/poppang-deploy/app
      DEPLOY_SCRIPT: /opt/poppang/deploy-prod.sh
      HEALTH_URL: http://localhost:4002/actuator/health

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image version
        run: |
          VERSION="${GITHUB_SHA::7}"
          IMAGE_NAME="${APP_NAME}:${VERSION}"
          IMAGE_TAR="${APP_NAME}-${VERSION}.tar"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "${GITHUB_ENV}"
          echo "IMAGE_TAR=${IMAGE_TAR}" >> "${GITHUB_ENV}"

      - name: Build jar
        run: ./gradlew clean bootJar --no-daemon --build-cache

      - name: Verify jar artifact
        run: bash scripts/ci/verify-build-artifacts.sh jar build/libs/*.jar

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image artifact
        run: bash scripts/ci/verify-build-artifacts.sh image "${IMAGE_NAME}"

      - name: Save Docker image
        run: |
          docker save --output "${IMAGE_TAR}" "${IMAGE_NAME}"
          chmod 644 "${IMAGE_TAR}"

      - name: Copy image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "${{ env.IMAGE_TAR }}"
          target: "${{ env.SERVER_DIR }}"

      - name: Copy deployment helper to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "scripts/ci/production-deploy-with-rollback.sh"
          target: "${{ env.SERVER_DIR }}"

      - name: Remote deploy
        id: remote_deploy
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          capture_stdout: true
          script: |
            set +e
            deployment_output="$(
              bash ${{ env.SERVER_DIR }}/scripts/ci/production-deploy-with-rollback.sh \
              ${{ env.SERVER_DIR }}/${{ env.IMAGE_TAR }} \
              ${{ env.IMAGE_NAME }} \
              ${{ env.CONTAINER_NAME }} \
              ${{ env.DEPLOY_SCRIPT }} \
              ${{ env.HEALTH_URL }} \
              ${{ github.sha }} \
              ${{ github.run_id }}-${{ github.run_attempt }}
            )"
            deploy_exit_code=$?
            printf '%s\n' "${deployment_output}"
            printf '%s\n' "remote_exit_code=${deploy_exit_code}"
            exit 0

      - name: Report deployment result
        if: always()
        env:
          DEPLOYMENT_ACTION_OUTCOME: ${{ steps.remote_deploy.outcome }}
          DEPLOYMENT_OUTPUT: ${{ steps.remote_deploy.outputs.stdout }}
          DEPLOYMENT_COMMIT: ${{ github.sha }}
          DEPLOYMENT_IMAGE: ${{ env.IMAGE_NAME }}
        run: scripts/ci/report-deployment-result.sh

  notify:
    name: Notify Result
    runs-on: ubuntu-latest
    needs:
      - verify
      - build-and-deploy
    if: always() && needs.verify.result == 'success'
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}

    steps:
      - name: Send email on success
        if: needs.build-and-deploy.result == 'success'
        continue-on-error: true
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ env.MAIL_USERNAME }}
          password: ${{ env.MAIL_PASSWORD }}
          subject: ✅ PopPang BE 배포 성공
          body: |
            🎉 PopPang BE 배포 완료

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Actor: ${{ github.actor }}

            Commit: ${{ github.sha }}

            CI URL
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          to: indextrown@gmail.com
          from: PopPang CI <${{ env.MAIL_USERNAME }}>

      - name: Send email on failure
        if: needs.build-and-deploy.result != 'success'
        continue-on-error: true
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ env.MAIL_USERNAME }}
          password: ${{ env.MAIL_PASSWORD }}
          subject: ❌ PopPang BE 배포 실패
          body: |
            ❌ PopPang BE 배포 실패

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Actor: ${{ github.actor }}

            확인 필요

            CI URL
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          to: indextrown@gmail.com
          from: PopPang CI <${{ env.MAIL_USERNAME }}>
