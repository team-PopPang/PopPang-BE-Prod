name: PopPang BE PR CI

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-ci:
    name: PR CI
    runs-on: ubuntu-latest

    steps:
      - name: Check branch name
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          branch_pattern='^(feature|fix|docs|refactor|test|ci|chore)/[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          if [[ ! "${BRANCH_NAME}" =~ ${branch_pattern} ]]; then
            echo "::error::브랜치는 feature|fix|docs|refactor|test|ci|chore/작업명 형식이어야 합니다."
            echo "::error::작업명은 영문 소문자로 시작하고 소문자·숫자를 단일 하이픈으로 연결하세요. 이슈 번호 접두어는 사용하지 않습니다. 예: feature/popup-collector-api"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Test and format check
        run: ./gradlew clean test spotlessCheck --no-daemon
