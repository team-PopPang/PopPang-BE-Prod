plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '6.25.0'
}

group = 'com.poppang'
version = '0.0.1-SNAPSHOT'
description = 'poppang-be-dev'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    gradlePluginPortal()
    google()
}

spotless {
    java {
        googleJavaFormat('1.17.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

dependencies {

    // --- Spring ---
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // --- Spring Security ---
    implementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.security:spring-security-test'

    // --- DB ---
    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // --- Lombok ---
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // --- Apple(JWT) ---
    implementation 'com.nimbusds:nimbus-jose-jwt:10.3'

    // --- Google ---
    implementation 'com.google.api-client:google-api-client:2.2.0'

    // --- Jackson2 JSON 팩토리 ---
    implementation 'com.google.http-client:google-http-client-jackson2:1.43.2'

    // --- Swagger ---
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

    // --- JWT ---
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly    'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly    'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // --- 이메일 발송 라이브러리 ---
    implementation 'com.sun.mail:jakarta.mail:2.0.1'

    // --- AWS S3 (운영 제보 이미지 저장, EC2 인스턴스 역할 기본 자격증명 체인) ---
    // 동기 HTTP 클라이언트는 apache-client(HttpClient 4)만 쓴다. apache5-client가 가져오는 HttpClient 5는
    // Spring의 기본 요청 팩토리를 바꾸고 Spring Boot가 고정한 버전과도 맞지 않는다.
    implementation platform('software.amazon.awssdk:bom:2.55.10')
    implementation('software.amazon.awssdk:s3') {
        exclude group: 'software.amazon.awssdk', module: 'apache5-client'
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
    }
    implementation 'software.amazon.awssdk:apache-client'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'

}

tasks.named('bootJar') {
    // Apple 키는 런타임 외부 파일로만 주입한다. 로컬 src/main/resources에 있어도 배포 JAR에 넣지 않는다.
    exclude '**/*.p8'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'spring.profiles.active', 'test'
    systemProperty 'spring.config.location', 'classpath:/application-test.yml'
    // AWS SDK가 개발자 PC의 AWS 설정·자격증명 파일이나 EC2 metadata를 읽지 않게 한다.
    systemProperty 'aws.configFile', layout.buildDirectory.file('aws-test-sandbox/config').get().asFile.absolutePath
    systemProperty 'aws.sharedCredentialsFile', layout.buildDirectory.file('aws-test-sandbox/credentials').get().asFile.absolutePath
    systemProperty 'aws.disableEc2Metadata', 'true'

    doFirst {
        def requestedProfiles = [
            System.getProperty('spring.profiles.active'),
            System.getProperty('spring.profiles.include'),
            System.getenv('SPRING_PROFILES_ACTIVE'),
            System.getenv('SPRING_PROFILES_INCLUDE')
        ].findAll { it != null }
            .collectMany { it.split(',') as List }
            .collect { it.trim() }

        if (requestedProfiles.any { it.equalsIgnoreCase('prod') }) {
            throw new GradleException('The test task must not run with the prod profile.')
        }
    }
}
